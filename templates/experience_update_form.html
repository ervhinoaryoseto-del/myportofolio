{% extends "base.html" %}
{% block meta %}
    <title>Edit Experience - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Update Experience</p>
                <h1>Edit Experience</h1>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="button">
                        Simpan Perubahan
                    </button>
                    <a href="{% url 'main:show_experience' %}"
                       class="button button-secondary">
                        Batal
                    </a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
